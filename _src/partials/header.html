<a class="skip-link" href="#main">Skip to main content</a>

<!-- Interactive honeycomb surface. Purely presentational: aria-hidden and
     pointer-events:none. Tiles are generated by script.js to fit the viewport;
     with JavaScript off the section colours simply show on their own. -->
<div class="hex-surface" aria-hidden="true" data-hex-surface>
    <div class="hex-surface__grid" data-hex-grid></div>
</div>

<header class="site-header" id="top">
    <div class="read-progress" aria-hidden="true"><span class="read-progress__bar" data-read-progress></span></div>
    <div class="wrap site-header__inner">
        <a class="brand" href="{{base}}index.html">
            Mehbub&nbsp;Alam <small>PhD</small>
        </a>

        <button class="nav-toggle" type="button" id="nav-toggle"
                aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation menu">
            <svg class="icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" aria-hidden="true" focusable="false">
                <path d="M3 6h18M3 12h18M3 18h18"/>
            </svg>
            <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" aria-hidden="true" focusable="false">
                <path d="M5 5l14 14M19 5L5 19"/>
            </svg>
        </button>

        <nav class="nav" id="primary-nav" aria-label="Primary">
            {{nav}}
        </nav>
    </div>
</header>
